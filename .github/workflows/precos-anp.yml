# Robô do AbasteX: toda semana busca os preços médios da ANP (por estado e
# por município) e grava em abastex/precos.json, que o app lê.
name: Preços da ANP

on:
  schedule:
    # Sábado e domingo às 9h (horário de Brasília = 12h UTC). A ANP costuma
    # publicar a pesquisa da semana na sexta à tarde.
    - cron: "0 12 * * 6,0"
  workflow_dispatch: # botão "Run workflow" pra rodar na hora

permissions:
  contents: write

jobs:
  precos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar o que o robô usa
        run: pip install requests pandas openpyxl beautifulsoup4

      - name: Buscar os preços da ANP
        run: python scripts/precos_anp.py abastex/precos.json

      - name: Guardar no site (só se mudou)
        run: |
          git config user.name "robo-abastex"
          git config user.email "robo-abastex@users.noreply.github.com"
          git add abastex/precos.json
          if git diff --cached --quiet; then
            echo "Os preços não mudaram."
          else
            git commit -m "Preços da ANP da semana"
            git push
          fi
